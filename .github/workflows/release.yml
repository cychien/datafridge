name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Push to main only. Opens or updates the version PR when changesets are pending,
  # and succeeds as a no-op when none are. It passes no `publish` input, so this job
  # cannot publish: with no publish script, changesets/action returns without publishing.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: Release packages
          commit: 'chore: version packages'

  # Manual dispatch on main only. The single job that can publish: it is the only one
  # that enters the protected npm environment and receives NODE_AUTH_TOKEN. A push
  # never satisfies this condition, and a dispatch on any other ref never satisfies it.
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # changesets/action versions instead of publishing while changesets are pending,
      # so fail loudly on a dispatch that arrives before the version PR is merged.
      - name: Require an empty changeset queue
        run: node scripts/assert-changeset-queue-empty.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release:check
      # createGithubReleases also pushes the per-package git tags; v1 has no separate tag input.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          createGithubReleases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
